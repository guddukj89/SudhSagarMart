<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sudh Sagar Mart - Seller Panel</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#222;
}

/* HEADER */
.header{
  background:#ffffff;
  padding:15px 20px;
  border-bottom:1px solid #ddd;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:1000;
}

.logo{
  font-size:21px;
  font-weight:bold;
}

.logout-btn{
  background:#e53935;
  color:#fff;
  border:0;
  padding:9px 15px;
  border-radius:8px;
  cursor:pointer;
}

/* MAIN */
.container{
  width:100%;
  max-width:1200px;
  margin:auto;
  padding:20px;
}

/* WELCOME */
.welcome{
  margin-bottom:20px;
}

.welcome h1{
  margin:0 0 6px;
  font-size:26px;
}

.welcome p{
  margin:0;
  color:#666;
}

/* DASHBOARD CARDS */
.dashboard-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:20px;
}

.dashboard-card{
  background:#fff;
  border-radius:14px;
  padding:18px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.dashboard-card .title{
  color:#666;
  font-size:14px;
  margin-bottom:10px;
}

.dashboard-card .value{
  font-size:26px;
  font-weight:bold;
}

/* QUICK MENU */
.card{
  background:#fff;
  border-radius:14px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.card h2{
  margin:0 0 18px;
  font-size:20px;
}

/* MENU */
.menu-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.menu-btn{
  border:1px solid #ddd;
  background:#fff;
  border-radius:10px;
  padding:15px 10px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.menu-btn:hover{
  background:#f1f6ff;
}

/* RECENT ORDERS */
.order-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:13px 0;
  border-bottom:1px solid #eee;
}

.order-row:last-child{
  border-bottom:0;
}

.order-info{
  font-weight:bold;
}

.order-status{
  font-size:13px;
  padding:6px 10px;
  border-radius:20px;
  background:#fff3cd;
}

/* MOBILE */
@media(max-width:900px){

  .dashboard-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .menu-grid{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:600px){

  .header{
    padding:13px;
  }

  .logo{
    font-size:18px;
  }

  .container{
    padding:12px;
  }

  .welcome h1{
    font-size:22px;
  }

  .dashboard-grid{
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }

  .dashboard-card{
    padding:14px;
  }

  .dashboard-card .value{
    font-size:22px;
  }

  .menu-grid{
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }

  .menu-btn{
    padding:13px 6px;
    font-size:13px;
  }

  .order-row{
    align-items:flex-start;
    flex-direction:column;
  }
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">

  <div class="logo">
    🛒 Sudh Sagar Mart
  </div>

  <button class="logout-btn" onclick="logoutSeller()">
    Logout
  </button>

</div>


<div class="container">

  <!-- WELCOME -->
  <div class="welcome">

    <h1>
      Seller Dashboard
    </h1>

    <p>
      Welcome, <span id="sellerName">Seller</span>
    </p>

  </div>


  <!-- DASHBOARD SUMMARY -->
  <div class="dashboard-grid">

    <div class="dashboard-card">
      <div class="title">
        Today's Orders
      </div>

      <div class="value" id="todayOrders">
        0
      </div>
    </div>


    <div class="dashboard-card">
      <div class="title">
        Today's Sales
      </div>

      <div class="value">
        ₹<span id="todaySales">0</span>
      </div>
    </div>


    <div class="dashboard-card">
      <div class="title">
        Pending Orders
      </div>

      <div class="value" id="pendingOrders">
        0
      </div>
    </div>


    <div class="dashboard-card">
      <div class="title">
        Total Products
      </div>

      <div class="value" id="totalProducts">
        0
      </div>
    </div>

  </div>


  <!-- QUICK MENU -->
  <div class="card">

    <h2>
      Seller Menu
    </h2>

    <div class="menu-grid">

      <button class="menu-btn" onclick="openAddProduct()">
        ➕ Add Product
      </button>

      <button class="menu-btn" onclick="showMyProducts()">
        📦 My Products
      </button>

      <button class="menu-btn" onclick="showSellerOrders()">
        🛍️ Orders
      </button>

      <button class="menu-btn" onclick="showPaymentsSettlement()">
        💰 Payments
      </button>

      <button class="menu-btn" onclick="showSellerCustomers()">
        👥 Customers
      </button>

      <button class="menu-btn" onclick="showSellerReturns()">
        ↩️ Returns
      </button>

      <button class="menu-btn" onclick="showSellerNotifications()">
        🔔 Notifications
      </button>

      <button class="menu-btn" onclick="showSellerSettings()">
        ⚙️ Settings
      </button>

      <button class="menu-btn" onclick="showSellerBank()">
        🏦 Bank Account
      </button>

      <button class="menu-btn" onclick="showSellerComplaint()">
        📝 Complaint
      </button>

      <button class="menu-btn" onclick="showSellerHelpdesk()">
        🎧 Helpdesk
      </button>

    </div>

  </div>


  <!-- RECENT ORDERS -->
  <div class="card">

    <h2>
      Recent Orders
    </h2>

    <div id="recentOrders">

      <div class="order-row">

        <div class="order-info">
          No recent orders
        </div>

        <div class="order-status">
          -
        </div>

      </div>

    </div>

  </div>


  <!-- LOW STOCK -->
  <div class="card">

    <h2>
      Low Stock Products
    </h2>

    <div id="lowStockProducts">

      <div class="order-row">

        <div class="order-info">
          No low stock products
        </div>

      </div>

    </div>

  </div>

</div>


<script>

function logoutSeller(){

  alert("Logout system next step me connect hoga.");

}

function openAddProduct(){

  alert("Add Product next step me banayenge.");

}

function showMyProducts(){

  alert("My Products next step me banayenge.");

}

function showSellerOrders(){

  alert("Orders next step me banayenge.");

}

function showPaymentsSettlement(){

  alert("Payments next step me banayenge.");

}

function showSellerCustomers(){

  alert("Customers next step me banayenge.");

}

function showSellerReturns(){

  alert("Returns next step me banayenge.");

}

function showSellerNotifications(){

  alert("Notifications next step me banayenge.");

}

function showSellerSettings(){

  alert("Settings next step me banayenge.");

}

function showSellerBank(){

  alert("Bank Account next step me banayenge.");

}

function showSellerComplaint(){

  alert("Complaint next step me banayenge.");

}

function showSellerHelpdesk(){

  alert("Helpdesk next step me banayenge.");

}

</script>

</body>
</html>
