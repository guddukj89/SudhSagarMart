<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SudhSagarMart - Delivery Partner Login</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f6f4;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.card{
  width:100%;
  max-width:430px;
  background:white;
  border-radius:20px;
  padding:28px 22px;
  box-shadow:0 8px 30px rgba(0,0,0,.12);
}

.logo{
  text-align:center;
  font-size:28px;
  font-weight:bold;
  color:#087f3f;
  margin-bottom:5px;
}

.subtitle{
  text-align:center;
  color:#666;
  margin-bottom:25px;
}

h2{
  margin:0 0 18px;
  color:#222;
}

label{
  display:block;
  margin:13px 0 6px;
  font-weight:600;
  color:#333;
}

input,select{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:15px;
  outline:none;
}

input:focus,select:focus{
  border-color:#087f3f;
}

button{
  width:100%;
  border:0;
  border-radius:10px;
  padding:14px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.primary{
  background:#087f3f;
  color:white;
  margin-top:20px;
}

.secondary{
  background:#eef7f1;
  color:#087f3f;
  margin-top:12px;
}

.link{
  text-align:center;
  margin-top:18px;
  color:#087f3f;
  cursor:pointer;
  font-weight:bold;
}

.hidden{
  display:none;
}

.message{
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  display:none;
  font-size:14px;
}

.success{
  background:#e7f7ed;
  color:#087f3f;
}

.error{
  background:#ffe9e9;
  color:#b00020;
}

.small{
  font-size:12px;
  color:#777;
  margin-top:8px;
  line-height:1.5;
}
</style>
</head>

<body>

<div class="card">

<div class="logo">
  <img
    src="logo.png"
    alt="Sudh Sagar Mart"
    style="
      width:100%;
      max-width:260px;
      height:auto;
      display:block;
      margin:0 auto 10px;
      object-fit:contain;
    "
  >
</div>
  <div class="subtitle">Delivery Partner</div>

  <!-- LOGIN -->
  <div id="loginBox">

    <h2>Delivery Partner Login</h2>

    <label>Email</label>
    <input id="loginEmail" type="email"
           placeholder="Enter email">

    <label>Password</label>
    <input id="loginPassword" type="password"
           placeholder="Enter password">

    <button class="primary" onclick="loginPartner()">
      Login
    </button>

    <button class="secondary" onclick="showRegister()">
      Create Delivery Partner Account
    </button>

    <div class="link" onclick="forgotPassword()">
      Forgot Password?
    </div>

  </div>


  <!-- REGISTER -->
  <div id="registerBox" class="hidden">

    <h2>Create Account</h2>

    <label>Full Name</label>
    <input id="regName" type="text"
           placeholder="Enter full name">

    <label>Email</label>
    <input id="regEmail" type="email"
           placeholder="Enter email">

    <label>Mobile Number</label>
    <input id="regPhone" type="tel"
           placeholder="Enter mobile number"
           maxlength="10">

    <label>Password</label>
    <input id="regPassword" type="password"
           placeholder="Minimum 6 characters">

    <label>Vehicle Type</label>
    <select id="regVehicleType">
      <option value="">Select Vehicle</option>
      <option value="Cycle">Cycle</option>
      <option value="Bike">Bike</option>
      <option value="E-bike">E-bike</option>
      <option value="Scooter">Scooter</option>
    </select>

    <label>Vehicle Number</label>
    <input id="regVehicleNumber" type="text"
           placeholder="Vehicle number">

    <label>Delivery Area</label>
    <input id="regArea" type="text"
           placeholder="Your delivery area">

    <div class="small">
      Account create hone ke baad KYC status
      <b>Pending</b> rahega. Super Admin approval ke
      baad Delivery Partner access milega.
    </div>

    <button class="primary" onclick="createAccount()">
      Create Account
    </button>

    <button class="secondary" onclick="showLogin()">
      Already have an account? Login
    </button>

  </div>

  <div id="message" class="message"></div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  sendPasswordResetEmail,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  setDoc,
  getDoc,
  serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey: "AIzaSyCTwfL2U5MEq9zXBHQOWLwY9yGt93SjuGU",

  authDomain: "sudhsagarmart.firebaseapp.com",

  projectId: "sudhsagarmart",

  storageBucket: "sudhsagarmart.firebasestorage.app",

  messagingSenderId: "682379938859",

  appId: "1:682379938859:web:4cb3581fd0de81f4e72e6e"

};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


function message(text,type="error"){

  const box = document.getElementById("message");

  box.textContent = text;

  box.className = "message " + type;

  box.style.display = "block";

}


function hideMessage(){

  document.getElementById("message").style.display="none";

}


window.showRegister = function(){

  hideMessage();

  document.getElementById("loginBox").classList.add("hidden");

  document.getElementById("registerBox").classList.remove("hidden");

};


window.showLogin = function(){

  hideMessage();

  document.getElementById("registerBox").classList.add("hidden");

  document.getElementById("loginBox").classList.remove("hidden");

};


window.loginPartner = async function(){

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;


  if(!email || !password){

    return message("Email aur password dono bhariye.");

  }


  try{

    const result =
      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );


    const uid = result.user.uid;


    const partnerRef =
      doc(db,"deliveryPartners",uid);

    const partnerSnap =
      await getDoc(partnerRef);


    if(!partnerSnap.exists()){

      await auth.signOut();

      return message(
        "Yeh account Delivery Partner ke roop mein registered nahi hai."
      );

    }


    const partner = partnerSnap.data();


    if(
      partner.accountStatus &&
      partner.accountStatus !== "approved"
    ){

      await auth.signOut();

      return message(
        "Aapka Delivery Partner account abhi approved nahi hai."
      );

    }


    message(
      "Login successful. Delivery Panel open ho raha hai...",
      "success"
    );


    setTimeout(function(){

      location.href = "delivery.html";

    },700);


  }catch(error){

    console.error(error);

    let text = "Login failed.";

    if(error.code === "auth/invalid-credential"){
      text = "Email ya password galat hai.";
    }

    if(error.code === "auth/user-not-found"){
      text = "Account nahi mila.";
    }

    if(error.code === "auth/wrong-password"){
      text = "Password galat hai.";
    }

    if(error.code === "auth/too-many-requests"){
      text = "Bahut baar try kiya gaya. Thodi der baad try karein.";
    }

    message(text);

  }

};


window.createAccount = async function(){

  const name =
    document.getElementById("regName").value.trim();

  const email =
    document.getElementById("regEmail").value.trim();

  const phone =
    document.getElementById("regPhone").value.trim();

  const password =
    document.getElementById("regPassword").value;

  const vehicleType =
    document.getElementById("regVehicleType").value;

  const vehicleNumber =
    document.getElementById("regVehicleNumber").value.trim();

  const area =
    document.getElementById("regArea").value.trim();


  if(!name || !email || !phone || !password ||
     !vehicleType || !area){

    return message(
      "Name, Email, Mobile, Password, Vehicle aur Area bharna zaroori hai."
    );

  }


  if(phone.length !== 10){

    return message(
      "10 digit mobile number enter karein."
    );

  }


  if(password.length < 6){

    return message(
      "Password kam se kam 6 characters ka hona chahiye."
    );

  }


  try{

    message("Account create ho raha hai...","success");


    const result =
      await createUserWithEmailAndPassword(
        auth,
        email,
        password
      );


    const user = result.user;


    await setDoc(
      doc(db,"deliveryPartners",user.uid),
      {

        uid: user.uid,

        name: name,

        email: email,

        phone: phone,

        vehicleType: vehicleType,

        vehicleNumber: vehicleNumber,

        area: area,

        accountStatus: "pending",

        kycStatus: "Pending",

        dutyStatus: "offline",

        locationSharing: false,

        createdAt: serverTimestamp(),

        updatedAt: serverTimestamp()

      }
    );


    await auth.signOut();


    message(
      "Account successfully create ho gaya. Super Admin approval ke baad login kar sakte hain.",
      "success"
    );


    setTimeout(function(){

      showLogin();

    },1800);


  }catch(error){

    console.error(error);

    let text = "Account create nahi hua.";

    if(error.code === "auth/email-already-in-use"){
      text = "Is email se account pehle se bana hua hai.";
    }

    if(error.code === "auth/weak-password"){
      text = "Password bahut weak hai.";
    }

    if(error.code === "auth/invalid-email"){
      text = "Email address galat hai.";
    }


    message(text);

  }

};


window.forgotPassword = async function(){

  const email =
    document.getElementById("loginEmail").value.trim();


  if(!email){

    return message(
      "Pehle login email enter karein."
    );

  }


  try{

    await sendPasswordResetEmail(
      auth,
      email
    );

    message(
      "Password reset link aapke email par bhej diya gaya hai.",
      "success"
    );

  }catch(error){

    console.error(error);

    message(
      "Password reset nahi ho saka. Email check karein."
    );

  }

};


// Agar already logged-in hai
onAuthStateChanged(auth, async (user)=>{

  if(!user) return;

  try{

    const snap =
      await getDoc(
        doc(db,"deliveryPartners",user.uid)
      );

    if(snap.exists()){

      const data = snap.data();

      if(data.accountStatus === "approved"){

        location.href="delivery.html";

      }

    }

  }catch(error){

    console.error(error);

  }

});

</script>

</body>
</html>
