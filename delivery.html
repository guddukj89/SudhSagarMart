<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sudhsagar Mart - Runsheet & Route Optimization</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background-color: #f4f6f9; padding: 15px; color: #333; }
    
    .header { background: #fff; padding: 15px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 15px; }
    .brand { font-size: 16px; font-weight: bold; color: #2c3e50; }
    
    .runsheet-card { background: #007bff; color: white; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
    .runsheet-card h3 { font-size: 16px; margin-bottom: 5px; }
    .runsheet-card p { font-size: 13px; opacity: 0.9; }

    .route-btn { background: #28a745; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; }
    
    .order-card { background: #fff; border-radius: 10px; padding: 15px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border-left: 5px solid #007bff; position: relative; }
    .seq-number { position: absolute; right: 15px; top: 15px; background: #e3f2fd; color: #0d47a1; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 12px; }
    
    .info-row { font-size: 13px; margin-bottom: 6px; color: #555; }
    .btn-action { width: 100%; padding: 10px; border: none; border-radius: 6px; background-color: #007bff; color: white; font-weight: bold; cursor: pointer; font-size: 13px; margin-top: 8px; }
  </style>
</head>
<body>

  <div class="header">
    <div class="brand">Sudhsagar Mart Delivery Partner</div>
    <small id="partner-email">Loading...</small>
  </div>

  <!-- Active Runsheet Banner -->
  <div class="runsheet-card">
    <h3 id="runsheet-id">Runsheet: Loading...</h3>
    <p id="total-assigned">Total Assigned Orders: 0</p>
  </div>

  <!-- Route Optimization Trigger Button -->
  <button class="route-btn" onclick="openOptimizedRoute()">
    📍 Start Optimized Route Navigation
  </button>

  <h4 style="margin-bottom: 10px; color: #555;">Optimized Sequence List</h4>
  <div id="orders-container">
    <p style="text-align: center; color: #777;">Runsheet check ho rahi hai...</p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, query, where, onSnapshot, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "YOUR_REAL_FIREBASE_API_KEY_HERE",
      authDomain: "sudhsagarmart.firebaseapp.com",
      projectId: "sudhsagarmart",
      storageBucket: "sudhsagarmart.firebasestorage.app",
      messagingSenderId: "682379938859",
      appId: "1:682379938859:web:4cb3581fd0de81f4e72e6e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let activeOrders = [];

    onAuthStateChanged(auth, (user) => {
      if (user) {
        document.getElementById('partner-email').innerText = user.email;
        loadRunsheetData(user.uid);
      } else {
        window.location.href = "/login.html";
      }
    });

    // Fetch Active Runsheet & Sequence
    function loadRunsheetData(partnerId) {
      const q = query(
        collection(db, "orders"),
        where("deliveryBoyId", "==", partnerId),
        where("orderStatus", "in", ["Assigned", "Picked Up", "Out for Delivery"])
      );

      onSnapshot(q, (snapshot) => {
        const container = document.getElementById('orders-container');
        container.innerHTML = "";
        activeOrders = [];

        if (snapshot.empty) {
          container.innerHTML = "<p style='text-align:center; color:#777;'>Koi active runsheet order nahi hai.</p>";
          document.getElementById('runsheet-id').innerText = "Runsheet: Not Assigned";
          document.getElementById('total-assigned').innerText = "Total Assigned Orders: 0";
          return;
        }

        let seq = 1;
        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          data.id = docSnap.id;
          data.sequence = data.routeSequence || seq;
          activeOrders.push(data);
          seq++;
        });

        // Sequence ke hisab se sort karna
        activeOrders.sort((a, b) => a.sequence - b.sequence);

        document.getElementById('runsheet-id').innerText = `Runsheet: RS-${new Date().toISOString().slice(0,10).replace(/-/g,"")}`;
        document.getElementById('total-assigned').innerText = `Total Assigned Orders: ${activeOrders.length}`;

        activeOrders.forEach((order, index) => {
          const card = document.createElement('div');
          card.className = 'order-card';
          card.innerHTML = `
            <div class="seq-number">#${index + 1}</div>
            <div class="info-row"><strong>Order ID:</strong> #${order.id.substr(0, 8)}</div>
            <div class="info-row"><strong>Customer:</strong> ${order.customerName || 'N/A'}</div>
            <div class="info-row"><strong>Address:</strong> ${order.address || 'N/A'}</div>
            <div class="info-row"><strong>Status:</strong> ${order.orderStatus}</div>
            <button class="btn-action" onclick="updateOrderStatus('${order.id}', '${order.orderStatus}')">
              ${getNextStatusText(order.orderStatus)}
            </button>
          `;
          container.appendChild(card);
        });
      });
    }

    // Google Maps Optimized Route Generation
    window.openOptimizedRoute = () => {
      if (activeOrders.length === 0) {
        alert("Route banane ke liye koi active order nahi hai!");
        return;
      }

      const addresses = activeOrders.map(o => encodeURIComponent(o.address));
      const destination = addresses.pop(); // Aakhri stop
      const waypoints = addresses.join('|'); // Beech ke stops

      let mapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${destination}`;
      if (waypoints) {
        mapsUrl += `&waypoints=${waypoints}&dir_action=navigate`;
      }

      window.open(mapsUrl, '_blank');
    };

    function getNextStatusText(current) {
      if (current === "Assigned") return "Mark Picked Up";
      if (current === "Picked Up") return "Mark Out for Delivery";
      if (current === "Out for Delivery") return "Mark Delivered";
      return "Completed";
    }

    window.updateOrderStatus = async (id, current) => {
      let nextStatus = "Delivered";
      if (current === "Assigned") nextStatus = "Picked Up";
      else if (current === "Picked Up") nextStatus = "Out for Delivery";

      try {
        await updateDoc(doc(db, "orders", id), { orderStatus: nextStatus });
        alert("Status Update: " + nextStatus);
      } catch (e) {
        alert("Error: " + e.message);
      }
    };
  </script>
</body>
</html>
